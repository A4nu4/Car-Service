# Secrets (DB_PASSWORD, JWT_SECRET) have no defaults on purpose:
# the application refuses to start until they are provided.
spring:
  application:
    name: car-rental-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/car_rental}
    username: ${DB_USERNAME:car_rental}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:car-rental-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rental:
    time-zone: ${RENTAL_TIME_ZONE:Europe/Berlin}
    currency: ${RENTAL_CURRENCY:EUR}
    min-driver-age: 21
    max-rental-days: 30
    booking-horizon-days: 365
    free-cancellation-window: 24h
    late-return-grace: 59m
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
